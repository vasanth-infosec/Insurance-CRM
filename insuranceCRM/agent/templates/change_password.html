{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'agent/css/agent_style.css'%}">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">
    <title>Change Password</title>
</head>

<body>

    <div class="d-flex">
        {% include 'includes/agent_sidebar.html' %}

        <!-- Main Content -->
        <div class="flex-grow-1">

            {% include 'includes/agent_navbar.html' %}

        </div>

    </div>
    <!-- Page Content -->
    <div class="p-4 main-content">
        <div class="container">
    <div class="row justify-content-center  g-5">
        <div class="col-xl-5 col-md-8">
            <div class="changep p-5 ">
                <div class="d-flex flex-column gap-3">
                    <h3 class="fw-bold text-center mb-3">Change Password</h3>
                    <form action="{% url 'changepassword' %} " method="post" id="changepassword" >
                        {% csrf_token %}
                        <div class="d-flex flex-column gap-3">
                            <div class="d-flex flex-column gap-3">
                                <label for="" class="fw-bold">New Password</label>
                                 <input type="password" name="npassword" id="npassword" required>
                                 <span id="passwordError" class="text-danger"></span>
                                 
                            </div>
                            <div class="d-flex flex-column gap-3">
                                <label for="" class="fw-bold">Confirm Password </label>
                                <input type="password"  name="cpassword" id="cpassword" required>
                                <span id="confirmError" class="text-danger"></span>
                            </div>
                            <div class="d-flex justify-content-between align-items-center">
                                <a href="{% url 'agent_dashboard' %}" class="btn btn-primary fw-bold btn-sm p-2">back</a>
                                <button type="submit" class="btn btn-primary fw-bold">Reset Password</button>      
                            </div>
                            
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
    </div>
    {% include 'includes/agent_mobile_sidebar.html' %}

<script>

const form = document.getElementById("changepassword");

const password = document.getElementById("npassword");
const confirmPassword = document.getElementById("cpassword");

const passwordError = document.getElementById("passwordError");
const confirmError = document.getElementById("confirmError");

let passwordValid = false;
let confirmValid = false;


// New Password Validation
password.addEventListener("input", function(){

    let pattern =
    /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

    if(pattern.test(password.value)){
        passwordError.innerHTML = "";
        passwordValid = true;
    }
    else{
        passwordError.innerHTML =
        "Password must contain 8+ characters, uppercase, lowercase, number and special character";
        passwordValid = false;
    }

});


// Confirm Password Validation
confirmPassword.addEventListener("input", function(){

    if(password.value === confirmPassword.value){
        confirmError.innerHTML = "";
        confirmValid = true;
    }
    else{
        confirmError.innerHTML = "Passwords do not match";
        confirmValid = false;
    }

});


// Form Submit Validation
form.addEventListener("submit", function(e){

    if(!passwordValid || !confirmValid){
        e.preventDefault();
        alert("Please fix all validation errors.");
    }

});

</script>







</body>

</html>
