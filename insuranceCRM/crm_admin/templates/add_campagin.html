{% extends 'admin_base.html' %}
{% block title %}Add Campagin{% endblock %}
{% block content %}
<br>
<br>

<div class="container ">
    <div class="">

        <div class="row justify-content-center">
            <div class="col-xl-8 ">
                <div class="add-agent px-5 py-4">
                    <h2 class="text-center fw-bold mb-5 gold">Add Campagin</h2>
                    <form method="post" action="{% url 'addcampagin' %}" id="campaginForm" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="row justify-content-center g-3">
                            <div class="col-xl-6">

                                <div class="d-flex flex-column gap-3 ">
                                    <label for="" class="fw-bold">Campagin Name </label>
                                    <input type="text" placeholder="Enter the Campagin Name" class="rounded-3 px-3 py-1"
                                        name="name" required>

                                </div>
                            </div>

                            <div class="col-xl-6">
                                <div class="d-flex flex-column gap-3 ">

                                    <label for="" class="fw-bold">Agent</label>
                                    <select name="agent" id="agentSelect" class="rounded-3 px-3 py-1" required>
                                        <option value="">Choose Agent</option>

                                        {% for a in agent %}
                                        <option value="{{ a.id }}" data-dept="{{ a.department }}">
                                            {{ a.admin.first_name }} {{ a.admin.last_name }}
                                        </option>
                                        {% endfor %}

                                    </select>
                                </div>
                            </div>

                            <div class="col-xl-6">
                                <div class="d-flex flex-column gap-3 ">

                                    <label for="" class="fw-bold">Date </label>
                                    <input type="date" class="rounded-3 px-3 py-1" id="date" name="date" required>
                                    <span id="dateError" class="text-danger"></span>

                                </div>
                            </div>
                            <div class="col-xl-6">
                                <div class="d-flex flex-column gap-3 ">

                                    <label for="" class="fw-bold">Time </label>
                                    <input type="time" class="rounded-3 px-3 py-1" i name="time" required>

                                </div>
                            </div>


                            <div class="col-xl-12">
                                <div class="d-flex flex-column gap-3 ">

                                    <label class="fw-bold">Search Location</label>
                                    <input id="searchInput" type="text" class="form-control mb-2"
                                        placeholder="Search location..." name="location" required>

                                    <iframe id="mapFrame" width="100%" height="350"
                                        style="border:0; border-radius:10px;" loading="lazy" allowfullscreen
                                        src="https://www.google.com/maps?q=Madurai&output=embed">
                                    </iframe>
                                </div>
                            </div>

                            <div class="">

                                <button type="submit" class="btn btn-primary fw-bold mt-3 ">Add</button>

                            </div>
                    </form>

                </div>
            </div>


        </div>
    </div>
</div>
<script>
    let dateValid = false;


    document.getElementById("searchInput").addEventListener("change", function () {
        let location = this.value;
        document.getElementById("mapFrame").src =
            "https://www.google.com/maps?q=" + location + "&output=embed";
    });


    const date = document.getElementById("date");
    const dateError = document.getElementById("dateError");

    date.addEventListener("input", function () {

        let selectedDate = new Date(this.value);
        let today = new Date();

        today.setHours(0, 0, 0, 0);

        if (selectedDate < today) {
            dateError.innerHTML = "Past date is not allowed";
            dateValid = false;
        } else {
            dateError.innerHTML = "";
            dateValid = true;
        }

    });
    const form = document.getElementById("campaginForm");

    form.addEventListener("submit", function(e){

    if(!dateValid){
        e.preventDefault();
        alert("Please give valid date");
    }

});

</script>
{% endblock %}
