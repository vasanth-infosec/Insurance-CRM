{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{% static 'crm_admin/css/admin_style.css'%}">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">
    <title>Edit Agent</title>
</head>

<body>

    <div class="d-flex">
        {% include 'includes/admin_sidebar.html' %}

        <!-- Main Content -->
        <div class="flex-grow-1">

            {% include 'includes/admin_navbar.html' %}

        </div>

    </div>
    <!-- Page Content -->
    <div class="p-4 main-content">
        <div class="container ">
            <div class="">

                <div class="row justify-content-center">
                    <div class="col-xl-8 ">
                        <div class="add-agent px-5 py-4">
                            <h2 class="text-center fw-bold mb-5 gold">Edit Campagin</h2>
                            <form method="post" action="{% url 'editcampagin' data.id %}" id="campaginForm"
                                enctype="multipart/form-data">
                                {% csrf_token %}
                                <div class="row justify-content-center g-3">
                                    <div class="col-xl-6">

                                        <div class="d-flex flex-column gap-3 ">
                                            <label for="" class="fw-bold">Campagin Name </label>
                                            <input type="text" p value="{{data.name}}"
                                                class="rounded-3 px-3 py-1"   name="name" required>
                                             
                                        </div>
                                    </div>
                                     
    
                                    <div class="col-xl-6">
                                        <div class="d-flex flex-column gap-3 ">

                                            <label for="" class="fw-bold">Agent</label>
                                            <select name="agent" id="agentSelect" class="rounded-3 px-3 py-1" required>
                                                <option value="">Choose Agent</option>

                                                {% for a in agent %}
                                                <option value="{{ a.id }}" data-dept="{{ a.department }}"  {% if data.agent.id == a.id %}selected{% endif %}>
                                                    {{ a.admin.first_name }} {{ a.admin.last_name }}
                                                </option>
                                                {% endfor %}

                                            </select>
                                        </div>
                                    </div>

                                    <div class="col-xl-6">
                                        <div class="d-flex flex-column gap-3 ">

                                            <label for="" class="fw-bold">Date </label>
                                            <input type="date" class="rounded-3 px-3 py-1" id="date" name="date" value="{{data.date|date:'Y-m-d' }}" required
                                                >
                                            <span id="dateError" class="text-danger"></span>
                                        </div>
                                    </div>
                                    <div class="col-xl-6">
                                        <div class="d-flex flex-column gap-3 ">

                                            <label for="" class="fw-bold">Time </label>
                                            <input type="time" class="rounded-3 px-3 py-1"  name="time" value="{{data.time|time:'H:i'}}" required
                                                >
                                             
                                        </div>
                                    </div>
                                     
                                   

                                    <div class="col-xl-12">
                                        <div class="d-flex flex-column gap-3 ">

                                            <label class="fw-bold">Search Location</label>
                                            <input id="searchInput" type="text" class="form-control mb-2"
                                                placeholder="Search location..." name="location" value="{{data.location}}" required >

                                            <iframe id="mapFrame" width="100%" height="350"
                                                style="border:0; border-radius:10px;" loading="lazy" allowfullscreen
                                                src="https://www.google.com/maps?q={{data.location}}&output=embed">
                                            </iframe>
                                        </div>
                                    </div>

                                    <div class="d-flex justify-content-between">
                                        <a href="{% url 'view_campagin' %}" class="btn btn-primary fw-bold">back</a>
                                        <button type="submit" class="btn  fw-bold">Edit</button>      
                                    </div>
                            </form>

                        </div>
                    </div>


                </div>
            </div>
        </div>
    </div>
<script>
        document.getElementById("searchInput").addEventListener("change", function () {
            let location = this.value;
            document.getElementById("mapFrame").src =
                "https://www.google.com/maps?q=" + location + "&output=embed";
        });
    
    let dateValid = true
    const date = document.getElementById("date");
    const dateError = document.getElementById("dateError");

    date.addEventListener("input", function () {

        let selectedDate = new Date(this.value);
        let today = new Date();

        today.setHours(0, 0, 0, 0);

        if (selectedDate < today) {
            dateError.innerHTML = "Past date is not allowed";
            dateValid=false
        } else {
            dateError.innerHTML = "";
            dateValid=true
        }

    });
    const form = document.getElementById("campaginForm");

    form.addEventListener("submit", function(e){

    if(!dateValid){
        e.preventDefault();
        alert("Please give valid date");
    }

});

</script>
    {% include 'includes/mobile_sidebar.html' %}









</body>

</html>
